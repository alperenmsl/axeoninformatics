<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sidebar">
    <h2><i data-lucide="terminal-square"></i> Admin</h2>
    <ul>
      <li onclick="showPage('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</li>
      <li onclick="showPage('orders')"><i data-lucide="shopping-cart"></i> Aufträge</li>
      <li onclick="showPage('transactions')"><i data-lucide="credit-card"></i> Transaktionen</li>
      <li onclick="logout()"><i data-lucide="log-out"></i> Logout</li>
    </ul>
  </div>

  <div class="main">
    <div id="dashboard" class="page active">
      <h1>📊 Dashboard</h1>
      <div class="card">Systemstatus: <span class="status online">Online</span></div>
    </div>

    <div id="orders" class="page">
      <h1>🛒 Aufträge</h1>
      <div id="orderList" class="card"></div>
      <br>
      <button id="addOrderButton" onclick="toggleAddOrderForm()" style="display:none;">Neuen Auftrag hinzufügen</button>
      <div id="addOrderForm" style="display:none;">
        <h3>Neuen Auftrag hinzufügen</h3>
        <form id="orderForm">
          <label for="customerName">Kunde:</label>
          <input type="text" id="customerName" name="customerName" required>
          <label for="orderTitle">Auftragstitel:</label>
          <input type="text" id="orderTitle" name="orderTitle" required>
          <label for="orderStatus">Status:</label>
          <input type="text" id="orderStatus" name="orderStatus" required>
          <label for="deadline">Deadline:</label>
          <input type="date" id="deadline" name="deadline" required>
          <button type="submit">Auftrag speichern</button>
        </form>
      </div>
    </div>

    <div id="transactions" class="page">
      <h1>💳 Transaktionen</h1>
      <div class="card" id="transactionList">Noch keine Transaktionen.</div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    lucide.createIcons();
  </script>

  <script>
    const apiUrl = "https://DEINE-BACKEND-URL.onrender.com"; // hier deine URL einfügen

    if (!localStorage.getItem("loggedIn")) {
      window.location.href = "login.html";
    }

    if (localStorage.getItem("role") === "admin") {
      document.getElementById("addOrderButton").style.display = "block";
    } else {
      document.getElementById("addOrderButton").style.display = "none";
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("role");
      window.location.href = "login.html";
    }

    function loadOrders() {
      fetch(`${apiUrl}/orders`)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("orderList");
          container.innerHTML = "";
          data.forEach(order => {
            const el = document.createElement("div");
            el.classList.add("order");
            el.innerHTML = `
              <h3>${order.orderTitle}</h3>
              <p>Kunde: ${order.customerName}</p>
              <p>Status: ${order.orderStatus}</p>
              <p>Deadline: ${order.deadline}</p>
            `;
            container.appendChild(el);
          });
        })
        .catch(err => console.log("Fehler beim Laden der Aufträge:", err));
    }

    document.getElementById("addOrderButton").addEventListener("click", function () {
      document.getElementById("addOrderForm").style.display = "block";
    });

    document.getElementById("orderForm").addEventListener("submit", function (e) {
      e.preventDefault();
      addOrder();
    });

    function addOrder() {
      const newOrder = {
        customerName: document.getElementById("customerName").value,
        orderTitle: document.getElementById("orderTitle").value,
        orderStatus: document.getElementById("orderStatus").value,
        deadline: document.getElementById("deadline").value
      };

      fetch(`${apiUrl}/orders`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newOrder)
      })
        .then(res => res.json())
        .then(() => {
          loadOrders();
          document.getElementById("addOrderForm").style.display = "none";
          document.getElementById("orderForm").reset();
        })
        .catch(err => console.log("Fehler beim Hinzufügen:", err));
    }

    function showPage(pageId) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(pageId).classList.add("active");
    }

    window.onload = loadOrders;
  </script>
</body>
</html>
